<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Day 14 four by four keypad wiring</title>
  <desc id="desc">Keypad row pins connect to Arduino pins 9, 8, 7, 6 and column pins connect to 5, 4, 3, 2.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Day 14 — 4×4 Matrix Keypad</text>
  <rect x="55" y="100" width="350" height="530" rx="28" fill="#0f766e" stroke="#134e4a" stroke-width="5"/><text x="230" y="150" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">Arduino Uno</text>
  <g font-family="monospace" font-size="21" fill="white"><text x="95" y="220">D9 D8 D7 D6</text><text x="95" y="485">D5 D4 D3 D2</text></g>
  <rect x="805" y="100" width="330" height="530" rx="25" fill="#1e293b"/><text x="970" y="145" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="white">4×4 Keypad</text>
  <g fill="#e2e8f0" stroke="#64748b" stroke-width="3"><rect x="845" y="180" width="55" height="55" rx="8"/><rect x="920" y="180" width="55" height="55" rx="8"/><rect x="995" y="180" width="55" height="55" rx="8"/><rect x="1070" y="180" width="45" height="55" rx="8"/><rect x="845" y="255" width="55" height="55" rx="8"/><rect x="920" y="255" width="55" height="55" rx="8"/><rect x="995" y="255" width="55" height="55" rx="8"/><rect x="1070" y="255" width="45" height="55" rx="8"/><rect x="845" y="330" width="55" height="55" rx="8"/><rect x="920" y="330" width="55" height="55" rx="8"/><rect x="995" y="330" width="55" height="55" rx="8"/><rect x="1070" y="330" width="45" height="55" rx="8"/><rect x="845" y="405" width="55" height="55" rx="8"/><rect x="920" y="405" width="55" height="55" rx="8"/><rect x="995" y="405" width="55" height="55" rx="8"/><rect x="1070" y="405" width="45" height="55" rx="8"/></g>
  <g stroke-width="7" fill="none"><path d="M405 205 H785" stroke="#ef4444"/><path d="M405 245 H785" stroke="#f97316"/><path d="M405 285 H785" stroke="#eab308"/><path d="M405 325 H785" stroke="#22c55e"/><path d="M405 470 H785" stroke="#06b6d4"/><path d="M405 510 H785" stroke="#3b82f6"/><path d="M405 550 H785" stroke="#8b5cf6"/><path d="M405 590 H785" stroke="#ec4899"/></g>
  <g font-family="monospace" font-size="18" font-weight="700"><text x="545" y="195">R1→D9</text><text x="640" y="235">R2→D8</text><text x="545" y="275">R3→D7</text><text x="640" y="315">R4→D6</text><text x="545" y="458">C1→D5</text><text x="640" y="498">C2→D4</text><text x="545" y="538">C3→D3</text><text x="640" y="578">C4→D2</text></g>
  <text x="600" y="672" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">Verify the keypad ribbon’s R1–R4/C1–C4 order from its datasheet; membrane keypad pin orders vary.</text>
