<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Day 17 sound sensor clap switch wiring</title>
  <desc id="desc">Sound sensor digital output connects to Arduino pin 3. The LED is driven by pin 13 through a resistor.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Day 17 — Sound Sensor Clap Switch</text>
  <rect x="60" y="105" width="340" height="500" rx="28" fill="#0f766e" stroke="#134e4a" stroke-width="5"/><text x="230" y="160" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">Arduino Uno</text><g font-family="monospace" font-size="22" fill="white"><text x="100" y="240">5 V</text><text x="100" y="325">D3 input</text><text x="100" y="410">D13</text><text x="100" y="495">GND</text></g>
  <rect x="800" y="110" width="320" height="260" rx="25" fill="#1d4ed8"/><circle cx="960" cy="215" r="58" fill="#94a3b8" stroke="#334155" stroke-width="7"/><text x="960" y="325" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="white">Sound Sensor Module</text>
  <rect x="800" y="445" width="320" height="120" rx="25" fill="#475569"/><text x="960" y="495" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="white">LED + 220 Ω</text><text x="960" y="535" text-anchor="middle" font-family="monospace" font-size="18" fill="white">D13 → resistor → LED → GND</text>
  <path d="M400 232 H780" stroke="#ef4444" stroke-width="8"/><path d="M400 317 H780" stroke="#3b82f6" stroke-width="8"/><path d="M400 402 H780 V490 H800" stroke="#f59e0b" stroke-width="8" fill="none"/><path d="M400 487 H760 V345 H800 M760 487 V540 H800" stroke="#334155" stroke-width="8" fill="none"/>
  <g font-family="Arial" font-size="18" font-weight="700"><text x="530" y="220">sensor VCC</text><text x="530" y="305">sensor DO → D3</text><text x="520" y="390">LED output</text><text x="520" y="475">common GND</text></g>
  <text x="600" y="660" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">Adjust the module threshold potentiometer until one clap produces one clean digital pulse.</text>
</svg>
