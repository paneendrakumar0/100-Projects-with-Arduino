<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Day 11 servo sweep wiring</title>
  <desc id="desc">Arduino Uno pin 9 connects to the servo signal. Five volts and ground connect to servo power and ground.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Day 11 — Servo Sweep</text>
  <rect x="70" y="120" width="360" height="470" rx="28" fill="#0f766e" stroke="#134e4a" stroke-width="5"/>
  <text x="250" y="175" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="white">Arduino Uno</text>
  <g font-family="monospace" font-size="24" fill="white"><text x="115" y="280">5 V</text><text x="115" y="370">D9</text><text x="115" y="460">GND</text></g>
  <g fill="white"><circle cx="410" cy="272" r="11"/><circle cx="410" cy="362" r="11"/><circle cx="410" cy="452" r="11"/></g>
  <rect x="795" y="195" width="330" height="320" rx="30" fill="#334155" stroke="#0f172a" stroke-width="5"/>
  <circle cx="960" cy="305" r="76" fill="#38bdf8" stroke="#075985" stroke-width="7"/>
  <rect x="945" y="205" width="30" height="100" fill="#cbd5e1"/>
  <text x="960" y="420" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="white">SG90 Servo</text>
  <g font-family="monospace" font-size="22" fill="#0f172a"><text x="830" y="555">Red: VCC</text><text x="830" y="585">Orange: signal</text><text x="830" y="615">Brown: GND</text></g>
  <path d="M421 272 H780" stroke="#ef4444" stroke-width="9"/><path d="M421 362 H780" stroke="#f59e0b" stroke-width="9"/><path d="M421 452 H780" stroke="#78350f" stroke-width="9"/>
  <g font-family="Arial" font-size="21" font-weight="700"><text x="570" y="258" fill="#b91c1c">5 V power</text><text x="570" y="348" fill="#b45309">D9 signal</text><text x="570" y="438" fill="#78350f">common GND</text></g>
  <rect x="70" y="625" width="1055" height="48" rx="12" fill="#fef3c7"/><text x="597" y="657" text-anchor="middle" font-family="Arial" font-size="20" fill="#78350f">Use an external regulated 5–6 V supply for larger servos; always join its ground to Arduino GND.</text>
</svg>
