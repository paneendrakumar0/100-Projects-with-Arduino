<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Day 18 water level sensor wiring</title>
  <desc id="desc">Arduino pin 7 gates sensor power, A0 reads the sensor signal, and grounds are common.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Day 18 — Resistive Water-Level Sensor</text>
  <rect x="65" y="115" width="345" height="450" rx="28" fill="#0f766e" stroke="#134e4a" stroke-width="5"/><text x="238" y="170" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">Arduino Uno</text><g font-family="monospace" font-size="23" fill="white"><text x="110" y="275">D7 output</text><text x="110" y="365">A0 input</text><text x="110" y="455">GND</text></g>
  <rect x="825" y="100" width="290" height="500" rx="24" fill="#0ea5e9" stroke="#0369a1" stroke-width="5"/><text x="970" y="150" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="white">Water Sensor</text><g stroke="#bae6fd" stroke-width="10"><path d="M875 205 V500"/><path d="M920 205 V500"/><path d="M965 205 V500"/><path d="M1010 205 V500"/><path d="M1055 205 V500"/></g><g font-family="monospace" font-size="20" fill="white"><text x="855" y="550">+ / S / −</text></g>
  <path d="M410 267 H800" stroke="#ef4444" stroke-width="9"/><path d="M410 357 H800" stroke="#f59e0b" stroke-width="9"/><path d="M410 447 H800" stroke="#334155" stroke-width="9"/><g font-family="Arial" font-size="20" font-weight="700"><text x="530" y="252">D7 → sensor + (gated power)</text><text x="530" y="342">sensor S → A0</text><text x="530" y="432">sensor − → GND</text></g>
  <rect x="65" y="615" width="1050" height="58" rx="12" fill="#fef3c7"/><text x="590" y="639" text-anchor="middle" font-family="Arial" font-size="18" fill="#78350f">Power is enabled only while sampling to slow probe corrosion.</text><text x="590" y="662" text-anchor="middle" font-family="Arial" font-size="18" fill="#78350f">If the module draws more than the board’s safe GPIO current, gate it with a transistor instead of powering it directly from D7.</text>
</svg>
