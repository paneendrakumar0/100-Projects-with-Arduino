<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Day 13 joystick mapper wiring</title>
  <desc id="desc">Joystick VRx connects to A0, VRy to A1, switch to D2, VCC to five volts, and ground to ground.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/><text x="600" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Day 13 — Joystick Mapper</text>
  <rect x="70" y="105" width="350" height="520" rx="28" fill="#0f766e" stroke="#134e4a" stroke-width="5"/><text x="245" y="160" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="white">Arduino Uno</text>
  <g font-family="monospace" font-size="22" fill="white"><text x="110" y="235">5 V</text><text x="110" y="315">A0</text><text x="110" y="395">A1</text><text x="110" y="475">D2</text><text x="110" y="555">GND</text></g><g fill="white"><circle cx="400" cy="227" r="10"/><circle cx="400" cy="307" r="10"/><circle cx="400" cy="387" r="10"/><circle cx="400" cy="467" r="10"/><circle cx="400" cy="547" r="10"/></g>
  <rect x="810" y="125" width="315" height="470" rx="30" fill="#1e293b"/><circle cx="967" cy="285" r="105" fill="#334155" stroke="#64748b" stroke-width="7"/><circle cx="967" cy="250" r="46" fill="#111827"/><path d="M967 250 V175" stroke="#111827" stroke-width="28"/><text x="967" y="430" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="white">Joystick Module</text><g font-family="monospace" font-size="19" fill="white"><text x="850" y="485">VCC VRx VRy SW GND</text></g>
  <path d="M411 227 H790" stroke="#ef4444" stroke-width="8"/><path d="M411 307 H790" stroke="#f59e0b" stroke-width="8"/><path d="M411 387 H790" stroke="#22c55e" stroke-width="8"/><path d="M411 467 H790" stroke="#3b82f6" stroke-width="8"/><path d="M411 547 H790" stroke="#334155" stroke-width="8"/>
  <g font-family="Arial" font-size="19" font-weight="700"><text x="565" y="214" fill="#b91c1c">VCC</text><text x="555" y="294" fill="#b45309">VRx</text><text x="555" y="374" fill="#15803d">VRy</text><text x="555" y="454" fill="#1d4ed8">SW (INPUT_PULLUP)</text><text x="555" y="534" fill="#334155">GND</text></g>
