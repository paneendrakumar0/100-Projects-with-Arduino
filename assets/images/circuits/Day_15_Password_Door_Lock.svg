<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Day 15 password door lock wiring</title>
  <desc id="desc">A keypad uses Arduino pins 2 through 9, servo signal uses pin 10, red and green LEDs use 11 and 12, and the buzzer uses A0.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/><text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Day 15 — Password Door Lock</text>
  <rect x="45" y="90" width="330" height="535" rx="28" fill="#0f766e" stroke="#134e4a" stroke-width="5"/><text x="210" y="140" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">Arduino Uno</text>
  <g font-family="monospace" font-size="20" fill="white"><text x="85" y="205">D2–D9</text><text x="85" y="285">D10</text><text x="85" y="365">D11</text><text x="85" y="445">D12</text><text x="85" y="525">A0</text><text x="85" y="590">5V/GND</text></g>
  <g fill="white"><circle cx="355" cy="198" r="9"/><circle cx="355" cy="278" r="9"/><circle cx="355" cy="358" r="9"/><circle cx="355" cy="438" r="9"/><circle cx="355" cy="518" r="9"/><circle cx="355" cy="583" r="9"/></g>
  <g font-family="Arial" font-size="22" font-weight="700"><rect x="815" y="75" width="310" height="120" rx="18" fill="#1e293b"/><text x="970" y="145" text-anchor="middle" fill="white">4×4 keypad: R/C pins</text><rect x="815" y="225" width="310" height="90" rx="18" fill="#334155"/><text x="970" y="280" text-anchor="middle" fill="white">Servo signal</text><rect x="815" y="345" width="145" height="90" rx="18" fill="#dc2626"/><text x="887" y="400" text-anchor="middle" fill="white">Red LED</text><rect x="980" y="345" width="145" height="90" rx="18" fill="#16a34a"/><text x="1052" y="400" text-anchor="middle" fill="white">Green LED</text><rect x="815" y="465" width="310" height="90" rx="18" fill="#111827"/><text x="970" y="520" text-anchor="middle" fill="white">Passive buzzer</text><rect x="815" y="585" width="310" height="60" rx="18" fill="#64748b"/><text x="970" y="625" text-anchor="middle" fill="white">Common 5 V / GND</text></g>
  <path d="M365 198 H795" stroke="#8b5cf6" stroke-width="8"/><path d="M365 278 H795" stroke="#f97316" stroke-width="8"/><path d="M365 358 H795" stroke="#dc2626" stroke-width="8"/><path d="M365 438 H970" stroke="#16a34a" stroke-width="8"/><path d="M365 518 H795" stroke="#111827" stroke-width="8"/><path d="M365 583 H795" stroke="#64748b" stroke-width="8"/>
  <g font-family="Arial" font-size="18" font-weight="700"><text x="490" y="188">keypad D9…D2</text><text x="500" y="268">servo D10</text><text x="500" y="348">D11 via 220 Ω</text><text x="500" y="428">D12 via 220 Ω</text><text x="500" y="508">A0 via 100 Ω</text><text x="500" y="573">shared supply</text></g>
  <text x="600" y="680" text-anchor="middle" font-family="Arial" font-size="19" fill="#78350f">Power the servo externally if needed and connect supply ground to Arduino GND.</text>
</svg>
