<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Day 20 flame sensor alarm wiring</title>
  <desc id="desc">Flame sensor analog output connects to A0, digital output to D2, LED to D11, and buzzer to D12.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/><text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Day 20 — Flame Sensor Alarm</text>
  <rect x="45" y="90" width="335" height="535" rx="28" fill="#0f766e" stroke="#134e4a" stroke-width="5"/><text x="212" y="140" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">Arduino Uno</text><g font-family="monospace" font-size="21" fill="white"><text x="85" y="215">5 V</text><text x="85" y="295">A0</text><text x="85" y="375">D2</text><text x="85" y="455">D11</text><text x="85" y="535">D12</text><text x="85" y="595">GND</text></g>
  <rect x="815" y="75" width="315" height="285" rx="24" fill="#b91c1c"/><text x="972" y="125" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="white">Flame Sensor Module</text><circle cx="972" cy="205" r="55" fill="#111827"/><g font-family="monospace" font-size="20" fill="white"><text x="850" y="320">VCC AO DO GND</text></g>
  <rect x="815" y="410" width="145" height="110" rx="20" fill="#dc2626"/><text x="887" y="455" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="white">Red LED</text><text x="887" y="490" text-anchor="middle" font-family="Arial" font-size="17" fill="white">via 220 Ω</text><rect x="980" y="410" width="150" height="110" rx="20" fill="#111827"/><text x="1055" y="455" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="white">Buzzer</text><text x="1055" y="490" text-anchor="middle" font-family="Arial" font-size="17" fill="white">via 100 Ω</text><rect x="815" y="560" width="315" height="70" rx="18" fill="#64748b"/><text x="972" y="605" text-anchor="middle" font-family="Arial" font-size="22" fill="white">Common GND</text>
  <path d="M380 207 H795" stroke="#ef4444" stroke-width="8"/><path d="M380 287 H795" stroke="#f59e0b" stroke-width="8"/><path d="M380 367 H795" stroke="#3b82f6" stroke-width="8"/><path d="M380 447 H795" stroke="#dc2626" stroke-width="8"/><path d="M380 527 H970" stroke="#111827" stroke-width="8"/><path d="M380 587 H795" stroke="#64748b" stroke-width="8"/>
  <g font-family="Arial" font-size="18" font-weight="700"><text x="500" y="195">sensor VCC</text><text x="500" y="275">AO → A0</text><text x="500" y="355">DO → D2</text><text x="500" y="435">D11 alarm LED</text><text x="500" y="515">D12 buzzer</text><text x="500" y="575">shared ground</text></g>
  <text x="600" y="675" text-anchor="middle" font-family="Arial" font-size="19" fill="#991b1b">Use only a controlled test source at a safe distance; this educational sensor is not a certified fire alarm.</text>
</svg>
