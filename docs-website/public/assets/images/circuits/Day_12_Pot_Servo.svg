<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Day 12 potentiometer controlled servo wiring</title>
  <desc id="desc">A potentiometer is wired between five volts and ground with its wiper at A0. Servo signal is connected to pin 9.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Day 12 — Potentiometer Controls Servo</text>
  <rect x="55" y="105" width="340" height="500" rx="28" fill="#0f766e" stroke="#134e4a" stroke-width="5"/><text x="225" y="160" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="white">Arduino Uno</text>
  <g font-family="monospace" font-size="23" fill="white"><text x="100" y="250">5 V</text><text x="100" y="330">A0</text><text x="100" y="410">D9</text><text x="100" y="490">GND</text></g>
  <g fill="white"><circle cx="375" cy="242" r="10"/><circle cx="375" cy="322" r="10"/><circle cx="375" cy="402" r="10"/><circle cx="375" cy="482" r="10"/></g>
  <rect x="785" y="100" width="330" height="215" rx="24" fill="#92400e"/><text x="950" y="145" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="white">10 kΩ Potentiometer</text><path d="M835 225 h230" stroke="white" stroke-width="12"/><path d="M950 180 v45" stroke="white" stroke-width="8"/><text x="950" y="282" text-anchor="middle" font-family="monospace" font-size="20" fill="white">outer • wiper • outer</text>
  <rect x="785" y="385" width="330" height="220" rx="24" fill="#334155"/><circle cx="950" cy="470" r="55" fill="#38bdf8"/><text x="950" y="565" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="white">SG90 Servo</text>
  <path d="M386 242 H740 V200 H785" stroke="#ef4444" stroke-width="8" fill="none"/><path d="M386 322 H700 V225 H785" stroke="#f59e0b" stroke-width="8" fill="none"/><path d="M386 402 H740 V465 H785" stroke="#f97316" stroke-width="8" fill="none"/><path d="M386 482 H730 V275 H785 M730 482 V535 H785" stroke="#334155" stroke-width="8" fill="none"/>
  <g font-family="Arial" font-size="19" font-weight="700"><text x="515" y="230" fill="#b91c1c">5 V to pot + servo</text><text x="505" y="310" fill="#b45309">wiper to A0</text><text x="520" y="395" fill="#c2410c">D9 signal</text><text x="500" y="520" fill="#334155">common GND</text></g>
  <rect x="70" y="632" width="1050" height="42" rx="10" fill="#fef3c7"/><text x="595" y="660" text-anchor="middle" font-family="Arial" font-size="19" fill="#78350f">External servo power is recommended if the servo stalls or resets the Arduino; grounds must remain common.</text>
</svg>
