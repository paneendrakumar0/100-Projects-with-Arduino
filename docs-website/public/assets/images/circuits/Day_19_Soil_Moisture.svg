<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Day 19 soil moisture probe wiring</title>
  <desc id="desc">Arduino pin 7 gates soil probe module power, A0 reads analog output, and grounds are common.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Day 19 — Soil-Moisture Probe</text>
  <rect x="65" y="115" width="345" height="450" rx="28" fill="#0f766e" stroke="#134e4a" stroke-width="5"/><text x="238" y="170" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">Arduino Uno</text><g font-family="monospace" font-size="23" fill="white"><text x="110" y="275">D7 output</text><text x="110" y="365">A0 input</text><text x="110" y="455">GND</text></g>
  <rect x="815" y="105" width="300" height="250" rx="24" fill="#166534"/><text x="965" y="150" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="white">Probe Interface</text><g font-family="monospace" font-size="21" fill="white"><text x="855" y="225">VCC</text><text x="855" y="275">AO</text><text x="855" y="325">GND</text></g>
  <path d="M925 355 V570 M1010 355 V570" stroke="#a16207" stroke-width="34"/><path d="M925 390 V560 M1010 390 V560" stroke="#facc15" stroke-width="12"/><text x="968" y="610" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#713f12">resistive fork probe</text>
  <path d="M410 267 H790" stroke="#ef4444" stroke-width="9"/><path d="M410 357 H720 V270 H815" stroke="#f59e0b" stroke-width="9" fill="none"/><path d="M410 447 H750 V320 H815" stroke="#334155" stroke-width="9" fill="none"/><g font-family="Arial" font-size="20" font-weight="700"><text x="525" y="252">D7 → VCC (gated)</text><text x="505" y="342">AO → A0</text><text x="505" y="432">GND</text></g>
  <rect x="65" y="625" width="1050" height="48" rx="12" fill="#fef3c7"/><text x="590" y="657" text-anchor="middle" font-family="Arial" font-size="19" fill="#78350f">Gated power reduces electrolysis; use a transistor if module current exceeds the safe GPIO limit.</text>
</svg>
