<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Day 16 relay module wiring</title>
  <desc id="desc">Arduino pin 7 controls a five volt relay module. The relay contacts switch a separate low voltage load supply.</desc>
  <rect width="1200" height="700" fill="#f8fafc"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Day 16 — Relay Module Control</text>
  <rect x="55" y="115" width="330" height="430" rx="28" fill="#0f766e" stroke="#134e4a" stroke-width="5"/><text x="220" y="170" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">Arduino Uno</text><g font-family="monospace" font-size="23" fill="white"><text x="100" y="265">5 V</text><text x="100" y="350">D7</text><text x="100" y="435">GND</text></g>
  <rect x="720" y="95" width="400" height="310" rx="25" fill="#2563eb" stroke="#1e3a8a" stroke-width="5"/><text x="920" y="145" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="white">5 V Relay Module</text><g font-family="monospace" font-size="22" fill="white"><text x="760" y="225">VCC</text><text x="760" y="285">IN</text><text x="760" y="345">GND</text><text x="970" y="225">NC</text><text x="970" y="285">COM</text><text x="970" y="345">NO</text></g>
  <path d="M385 255 H700" stroke="#ef4444" stroke-width="8"/><path d="M385 340 H700" stroke="#f59e0b" stroke-width="8"/><path d="M385 425 H700" stroke="#334155" stroke-width="8"/><g font-family="Arial" font-size="19" font-weight="700"><text x="500" y="243">VCC</text><text x="500" y="328">D7 control</text><text x="500" y="413">GND</text></g>
  <rect x="720" y="455" width="400" height="150" rx="22" fill="#475569"/><text x="920" y="500" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="white">Separate low-voltage load circuit</text><text x="920" y="540" text-anchor="middle" font-family="monospace" font-size="20" fill="white">Supply + → COM; NO → load → Supply −</text><text x="920" y="575" text-anchor="middle" font-family="Arial" font-size="18" fill="#fde68a">Use NC instead of NO for normally-on behavior.</text>
  <rect x="55" y="625" width="1065" height="48" rx="12" fill="#fee2e2"/><text x="587" y="657" text-anchor="middle" font-family="Arial" font-size="19" fill="#991b1b">Begin with an isolated low-voltage DC load. Do not wire mains voltage on a breadboard.</text>
</svg>
